[project]
name = "tmbill-mcp"
version = "1.1.0"
description = "Connect TMBill to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No TMBill API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["tmbill", "tmbill api", "tmbill mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/tmbill-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=tmbill"
Source = "https://github.com/cotlet-connect/tmbill-mcp"

[project.scripts]
tmbill-mcp = "tmbill_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tmbill_agent.py" = "tmbill_agent.py"

[tool.hatch.build.targets.sdist]
include = ["tmbill_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
